name: Startkey Astra Instagram yayin

on:
  schedule:
    # 31 Agu 2026: Olcay gunde 2 paylasim istedi (11:00 + 19:00). Onceki
    # 5 saatlik tek-hedef pencere (7,22,37,52 x 5 saat) GUNLUK SINIR
    # olmadan calisiyordu; KeyBrox botunda ayni desen 30 gunluk kuyrugu
    # 2 gunde tuketip Meta'da hataya yol acti. publish.py'de artik "gunde
    # en fazla 2" kilidi VAR, bu yuzden pencere dar tutuluyor: her hedeften
    # sonraki ~40 dk icinde 3 deneme, tam saatte degil (GitHub'in en yogun
    # oldugu nokta).
    - cron: '7,27,47 8 * * *'    # 11:07-11:47 Turkiye saati (UTC+3)
    - cron: '7,27,47 16 * * *'   # 19:07-19:47 Turkiye saati (UTC+3)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu (hicbir sey yayinlanmaz)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 publish.py

      - name: Durumu kaydet
        if: success()
        run: |
          if git diff --quiet state/durum.json; then
            echo "Degisiklik yok."
          else
            git config user.name  "startkey-astra-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/durum.json
            git commit -m "Yayin durumu guncellendi [skip ci]"
            git push
          fi
