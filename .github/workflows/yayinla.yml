name: Startkey Astra Instagram yayin

on:
  schedule:
    # GitHub'in zamanlayicisi "en iyi caba" garantisi verir, dusuk trafikli
    # public repolarda saatlerce gecikebilir (27 Agu: 10:00 planli, 13:24'te
    # calisti). Hedef 10:00 TR ama 10:00-14:45 arasi 15 dk'da bir tekrar
    # dener; publish.py o gun zaten yayinlandiysa aninda cikar (idempotent),
    # bu yuzden fazladan tetiklenme guvenlidir ve cift gonderi yapmaz.
    - cron: '*/15 7-11 * * *'   # 10:00-14:45 Turkiye saati (UTC+3), 15 dk'da bir
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu (hicbir sey yayinlanmaz)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 publish.py

      - name: Durumu kaydet
        if: success()
        run: |
          if git diff --quiet state/durum.json; then
            echo "Degisiklik yok."
          else
            git config user.name  "startkey-astra-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/durum.json
            git commit -m "Yayin durumu guncellendi [skip ci]"
            git push
          fi
